  version: '3.8'

  services:
    db:
      image: postgres:17-alpine
      restart: always
      environment:
        POSTGRES_DB: sequelize-test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: root
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - backend_network 

    backend:
      build: .
      ports:
        - "3000:3000"
      depends_on:
        - db
      env_file:
        - .env
      command: sh -c "npm install && npm run dev"
      networks:
        - backend_network
    pgadmin:
      image: dpage/pgadmin4
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        - "5050:80"
      depends_on:
        - db
      networks:
        - backend_network

  volumes:
    postgres_data:
  networks:
    backend_network:
